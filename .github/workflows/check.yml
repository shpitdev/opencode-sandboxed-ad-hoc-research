name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
  DAYTONA_API_URL: ${{ vars.DAYTONA_API_URL }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}

jobs:
  Check:
    name: Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: CLI smoke checks
        run: |
          bun run analyze -- --help
          bun run start -- --help
          bun run setup -- --help

  BuildPackage:
    name: Build Package Artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Pack tarball
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          ls -la artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

  PackageE2E:
    name: Package Install E2E
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: BuildPackage
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts

      - name: Install package into clean project
        run: |
          mkdir e2e-install
          cd e2e-install
          npm init -y
          npm install ../artifacts/*.tgz

      - name: Run installed CLI binaries
        run: |
          cd e2e-install
          ./node_modules/.bin/opencode-sandboxed-research-analyze --help
          ./node_modules/.bin/opencode-sandboxed-research-start --help
          ./node_modules/.bin/opencode-sandboxed-research-setup --help
