name: ValidatePrTitle

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_title:
        description: "Pull request title to validate"
        required: true
        type: string

permissions:
  pull-requests: read

jobs:
  ValidatePrTitle:
    name: ValidatePrTitle
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || inputs.pr_title }}
        run: |
          title="${PR_TITLE}"
          if [ -z "${title// /}" ]; then
            echo "PR title cannot be empty."
            exit 1
          fi

          if [[ "$title" =~ ^[Ww][Ii][Pp]([:\ ]|$) ]]; then
            echo "PR title cannot start with WIP."
            exit 1
          fi

          echo "PR title is valid: $title"
