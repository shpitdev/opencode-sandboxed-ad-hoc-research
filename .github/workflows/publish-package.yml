name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  Publish:
    name: Publish To GitHub Packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package
        run: |
          bun run check
          bun run typecheck
          bun test
          bun run build

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry https://npm.pkg.github.com

  VerifyInstall:
    name: Verify Registry Install
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: Publish
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure npm for GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set @shpitdev:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm config set always-auth true

      - name: Install published package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_REF="${PACKAGE_NAME}@${PACKAGE_VERSION}"

          mkdir -p e2e-install
          cd e2e-install
          npm init -y

          for attempt in 1 2 3 4 5 6; do
            if npm install "$PACKAGE_REF"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Failed to install $PACKAGE_REF after retries" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Run installed CLI binaries
        run: |
          cd e2e-install
          ./node_modules/.bin/opencode-sandboxed-research-analyze --help
          ./node_modules/.bin/opencode-sandboxed-research-start --help
          ./node_modules/.bin/opencode-sandboxed-research-setup --help
